services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pulse_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pulse}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Pulse.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Database__Provider: "MySql"
      ConnectionStrings__MySql: "Server=mysql;Database=${MYSQL_DATABASE:-pulse};User=root;Password=${MYSQL_ROOT_PASSWORD:-pulse_dev}"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "host=rabbitmq"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "5080:8080"

  worker:
    build:
      context: .
      dockerfile: src/Pulse.Worker/Dockerfile
    environment:
      Database__Provider: "MySql"
      ConnectionStrings__MySql: "Server=mysql;Database=${MYSQL_DATABASE:-pulse};User=root;Password=${MYSQL_ROOT_PASSWORD:-pulse_dev}"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "host=rabbitmq"
      # M10：日报 cron 可配置，但默认值与 M5/M9 完全一致（每日 01:00 Asia/Shanghai）。
      # 仅在本机真验证「Quartz 到点自动触发」时，用 shell 环境变量临时改短：
      #   DAILY_REPORT_CRON="0/10 * * * * ?" docker compose up -d --force-recreate --no-deps worker
      # 验证完不带该变量重建即恢复默认；无需改动受版本控制的文件。
      Reports__DailyCron: "${DAILY_REPORT_CRON:-0 0 1 * * ?}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mysql_data:
